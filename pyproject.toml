[tool.poetry]
name = "resources-discovery"
version = "0.1.1"
description = "Resources Discovery"
authors = ["Clivaly <you@example.com>"]
readme = "README"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.35.49"
pandas = "^2.2.3"
halo = "^0.0.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
blue = "^0.9.1"
isort = "^5.13.2"
taskipy = "^1.14.0"

[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.5.42"
mkdocstrings = "^0.26.2"
mkdocstrings-python = "^1.12.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79

[tool.taskipy.tasks]
lint = "blue --check --diff . && isort --check --diff ."
docs = "mkdocs serve"
pre_test = "task lint"
test = "pytest -s -x --cov=resources_discovery -vv"
post_test = "./coverage html"
run = "poetry run python ./resources_discovery/main.py"